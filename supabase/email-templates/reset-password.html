<!-- Supabase: Authentication > Emails > Templates > "Reset password".
     Paste this in as the message body, and set the subject to: Your Maayasthra People reset code
     {{ .Token }} is the 6-digit one-time code the app asks for. -->
<div style="font-family:Inter,Arial,sans-serif;max-width:480px;margin:0 auto;padding:32px 24px;color:#171717">
  <h2 style="margin:0 0 8px;font-size:22px">Reset your password</h2>
  <p style="margin:0 0 24px;font-size:15px;line-height:1.5;color:#525252">
    Use this code to choose a new password for Maayasthra People. It works once and expires in 10 minutes.
  </p>
  <div style="font-size:36px;font-weight:700;letter-spacing:10px;padding:18px 0;text-align:center;background:#F5F5F5;border-radius:12px">{{ .Token }}</div>
  <p style="margin:24px 0 0;font-size:13px;line-height:1.5;color:#737373">
    If you did not ask for this, you can ignore this email. Your password has not changed. Never share this code with anyone.
  </p>
</div>
